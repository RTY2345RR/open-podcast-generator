[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "open-podcast-generator"
version = "0.1.0"
description = "Open-source AI podcast generator: turn a PDF, URL or text into a two-host podcast with cloned voices, transcript, chapters and an RSS feed. A NotebookLM podcast alternative."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RTY2345RR" }]
keywords = [
  "ai-podcast-generator", "podcast-generator", "notebooklm", "notebooklm-alternative", "notebooklm-podcast",
  "pdf-to-podcast", "text-to-podcast", "url-to-podcast", "voice-cloning", "text-to-speech", "tts",
  "multi-speaker-tts", "podcast", "rss", "transcript", "chapters", "llm", "openai", "ollama", "podcastfy-alternative",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "pypdf>=4",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2025.1.1"]
dev = ["pytest>=8", "build", "twine"]

[project.urls]
Homepage = "https://github.com/RTY2345RR/open-podcast-generator"
Repository = "https://github.com/RTY2345RR/open-podcast-generator"
Documentation = "https://github.com/RTY2345RR/open-podcast-generator#readme"
Issues = "https://github.com/RTY2345RR/open-podcast-generator/issues"
Changelog = "https://github.com/RTY2345RR/open-podcast-generator/blob/main/CHANGELOG.md"
"Voice engine" = "https://miragea.ai"

[project.scripts]
open-podcast-generator = "open_podcast_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_podcast_generator"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "LICENSE", "CHANGELOG.md", "CREDITS.md", "llms.txt", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
